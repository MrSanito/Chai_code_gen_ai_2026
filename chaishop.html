<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6e3;
      color: #5d4037;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    .menu {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .item {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 200px;
    }
  </style>
</head>
<body>
  <h1>The Chai Haven</h1>
  <p>Authentic Masala Chai & Brews</p>
  <div class='menu'>
    <div class='item'>
      <h3>Masala Chai</h3>
      <p>Spiced perfection</p>
    </div>
    <div class='item'>
      <h3>Ginger Chai</h3>
      <p>Zesty and warm</p>
    </div>
    <div class='item'>
      <h3>Adrak Elaichi</h3>
      <p>The classic blend</p>
    </div>
  </div>
</body>
</html>
